services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-danya}
      POSTGRES_USER: ${DB_USERNAME:-danya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-danya-local-password}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-danya} -d ${DB_NAME:-danya}"]
      interval: 5s
      timeout: 5s
      retries: 12

  vendure:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-danya}
      DB_USERNAME: ${DB_USERNAME:-danya}
      DB_PASSWORD: ${DB_PASSWORD:-danya-local-password}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      COOKIE_SECRET: ${COOKIE_SECRET:-replace-this-before-production}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-replace-this-before-production}
      ASSET_UPLOAD_DIR: /app/static/assets
      ASSET_URL_PREFIX: ${ASSET_URL_PREFIX:-http://localhost:3000/assets/}
    ports:
      - "3000:3000"
    volumes:
      - vendure_assets:/app/static/assets

  storefront:
    build: .
    restart: unless-stopped
    depends_on:
      - vendure
    environment:
      PORT: 3001
      VENDURE_SHOP_API_URL: http://vendure:3000/shop-api
      NEXT_PUBLIC_SITE_URL: ${APP_ORIGIN:-http://localhost:3001}
    ports:
      - "3001:3001"

volumes:
  postgres_data:
  vendure_assets:
