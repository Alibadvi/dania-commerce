name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm ci --prefix backend
      - run: npm run build --prefix backend
      - run: docker compose config --quiet

  cpanel-storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cpanel
        env:
          NEXT_PUBLIC_SITE_URL: https://daniastore.ir
          VENDURE_SHOP_API_URL: https://api.daniastore.ir/shop-api
          ALLOW_DUMMY_PAYMENTS: "false"
      - run: test -f dist/standalone/server.js
      - name: Package cPanel storefront
        run: |
          mkdir -p deploy/bundle
          cp -a dist/standalone/. deploy/bundle/
          cp app.cjs deploy/app.cjs
          du -sh deploy deploy/bundle/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: dania-storefront-cpanel
          path: deploy/
          if-no-files-found: error
          retention-days: 7

  migration-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: danya
          POSTGRES_USER: danya
          POSTGRES_PASSWORD: temporary-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U danya -d danya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - name: Generate initial migration against empty PostgreSQL
        run: cd backend && npx tsx scripts/generate-initial-migration.mts
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: danya
          DB_USERNAME: danya
          DB_PASSWORD: temporary-ci-only
          DB_SYNCHRONIZE: "false"
          APP_ENV: local
      - run: find backend/src/migrations -maxdepth 1 -type f -name '*.ts' -print
      - uses: actions/upload-artifact@v4
        with:
          name: dania-initial-migration-preview
          path: backend/src/migrations/*.ts
          if-no-files-found: error
          retention-days: 3
