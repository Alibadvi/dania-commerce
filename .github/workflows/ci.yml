name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm ci --prefix backend
      - run: npm run build --prefix backend
      - run: docker compose config --quiet

  cpanel-storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cpanel
        env:
          NEXT_PUBLIC_SITE_URL: https://daniastore.ir
          VENDURE_SHOP_API_URL: https://api.daniastore.ir/shop-api
          ALLOW_DUMMY_PAYMENTS: "false"
      - run: test -f dist/server/index.js
