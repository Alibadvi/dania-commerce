name: cPanel Vendure package

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cpanel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: danya
          POSTGRES_USER: danya
          POSTGRES_PASSWORD: temporary-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U danya -d danya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: npm run build --prefix backend
      - run: npm prune --omit=dev --prefix backend --no-audit --no-fund
      - name: Assemble lean runtime
        run: |
          mkdir -p deploy/dania-backend/import-assets
          cp backend/app.cjs backend/package.json deploy/dania-backend/
          cp -a backend/dist backend/node_modules backend/seed-data deploy/dania-backend/
          mv deploy/dania-backend/node_modules deploy/dania-backend/runtime-modules
          ln -s runtime-modules deploy/dania-backend/node_modules
          cp public/images/danya-catalog-grid.png deploy/dania-backend/import-assets/
          modules=deploy/dania-backend/runtime-modules
          rm -rf "$modules/@lingui/cli" "$modules/@lingui/format-po" "$modules/@vendure-io/ui" "$modules/lucide-react" "$modules/typescript" "$modules/shadcn" "$modules/@base-ui" "$modules/@tanstack" "$modules/tsx" "$modules/@ts-morph" "$modules/@tiptap" "$modules/prettier" "$modules/msw" "$modules/@modelcontextprotocol" "$modules/@esbuild" "$modules/@img/sharp-libvips-linuxmusl-x64" "$modules/@img/sharp-wasm32" "$modules/typeorm/browser" "$modules/lightningcss"
          rm -rf "$modules/@vendure/dashboard/node_modules/@esbuild" "$modules/@vendure/dashboard/node_modules/esbuild"
          find "$modules" -type f \( -name '*.map' -o -name '*.d.ts' -o -name '*.d.mts' \) -delete
          du -sh deploy/dania-backend
      - name: Verify migration, catalog, and server from packaged runtime
        working-directory: deploy/dania-backend
        env:
          APP_ENV: production
          APP_ORIGINS: https://daniastore.ir
          COOKIE_SECRET: ci-only-long-cookie-secret-0123456789
          SUPERADMIN_PASSWORD: ci-only-long-admin-credential
          ALLOW_DUMMY_PAYMENTS: "false"
          RUN_WORKER_IN_PROCESS: "true"
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: danya
          DB_USERNAME: danya
          DB_PASSWORD: temporary-ci-only
          DB_SYNCHRONIZE: "false"
          PORT: "3333"
        run: |
          node dist/migrate.js
          node dist/seed.js
          node app.cjs > "$RUNNER_TEMP/dania-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:3333/health && curl -fsS -o /dev/null http://127.0.0.1:3333/dashboard/; then
              echo "Vendure API and Dashboard are ready"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/dania-server.log"
          exit 1
      - name: Archive lean runtime
        run: |
          rm deploy/dania-backend/node_modules
          test -d deploy/dania-backend/runtime-modules
          tar -czf dania-backend-cpanel.tar.gz -C deploy dania-backend
          du -sh deploy/dania-backend dania-backend-cpanel.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: dania-backend-cpanel
          path: dania-backend-cpanel.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Package small update for already installed backends
        run: |
          mkdir -p deploy/dania-backend-update/dist
          cp backend/dist/vendure-config.js deploy/dania-backend-update/dist/
          cp backend/deploy-cpanel.sh deploy/dania-backend-update/
          tar -czf dania-backend-config-update.tar.gz -C deploy/dania-backend-update .
      - uses: actions/upload-artifact@v7
        with:
          name: dania-backend-config-update
          path: dania-backend-config-update.tar.gz
          if-no-files-found: error
          retention-days: 7
